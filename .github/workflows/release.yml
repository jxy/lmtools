name: release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The newest patch of the oldest Go release go.mod accepts, which
          # still gets security fixes; Go 1.24 or later stamps the tag into
          # the binary.
          go-version: '1.26'
          cache-dependency-path: go.mod

      - name: Build
        run: |
          for target in linux/amd64 freebsd/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            make build GOOS="$goos" GOARCH="$goarch"
          done

      - name: Check the stamped version
        run: |
          for bin in bin/*-*/lmc bin/*-*/apiproxy bin/*-*/alcfauth bin/*-*/notebook; do
            if ! go version -m "$bin" | grep -Eq "^[[:space:]]+mod[[:space:]]+lmtools[[:space:]]+$GITHUB_REF_NAME[[:space:]]*$"; then
              echo "$bin is not stamped with $GITHUB_REF_NAME:"
              go version -m "$bin"
              exit 1
            fi
          done

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          export LC_ALL=C
          # Add a guide, example, or prompt to the manifest to ship it in releases.
          manifest=.github/release-files.txt
          files=()
          while IFS= read -r file || [[ -n "$file" ]]; do
            files+=("$file")
          done < "$manifest"
          programs=(lmc apiproxy alcfauth notebook)
          { printf '%s\n' "${programs[@]}"; cat "$manifest"; } | sort -u > "$RUNNER_TEMP/lmtools-expected-files"
          for dir in bin/*-*/; do
            platform=$(basename "$dir")
            archive="dist/lmtools-$GITHUB_REF_NAME-$platform.tar.gz"
            tar -czf "$archive" "${files[@]}" -C "$dir" "${programs[@]}"
            tar -tzf "$archive" | sort | diff -u "$RUNNER_TEMP/lmtools-expected-files" -
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
          else
            set -- --title "$GITHUB_REF_NAME" --generate-notes
            case "$GITHUB_REF_NAME" in
              *-*) set -- "$@" --prerelease ;;
            esac
            gh release create "$GITHUB_REF_NAME" "$@" dist/*
          fi
